      timeout: 5
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 25
  allowed_fails: 100
  cooldown_time: 0
  fallbacks:
    - helpdesk-classify: ["helpdesk-classify-backup", "helpdesk-classify-mini"]
    - helpdesk-suggest: ["helpdesk-suggest-backup", "helpdesk-suggest-mini"]
    - helpdesk-topics: ["helpdesk-topics-backup", "helpdesk-topics-mini"]
    - helpdesk-extract: ["helpdesk-extract-backup"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
